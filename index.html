<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Physics Playground</title>
  <style>
    :root {
      --panel: rgba(16, 20, 29, 0.84);
      --panel-border: rgba(255,255,255,0.12);
      --text: #f4f7fb;
      --muted: #aab4c2;
      --accent: #7ce7ff;
      --accent2: #8e9bff;
    }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#070a10; color:var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app { position:relative; width:100%; height:100%; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .toolbar {
      position:absolute; top:16px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      max-width:calc(100% - 28px); padding:10px;
      background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
      backdrop-filter: blur(16px); box-shadow:0 16px 45px rgba(0,0,0,.28);
      z-index:10;
    }
    button {
      border:1px solid rgba(255,255,255,.12); background:#1a2130; color:var(--text);
      border-radius:11px; padding:9px 12px; font-weight:700; cursor:pointer;
      transition:transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    button:hover { background:#252e41; border-color:rgba(255,255,255,.24); transform:translateY(-1px); }
    button:active { transform:translateY(1px); }
    button.primary { background:linear-gradient(135deg,#21485a,#314284); border-color:rgba(124,231,255,.35); }
    button.danger { background:#392028; }
    .divider { width:1px; height:32px; background:rgba(255,255,255,.12); margin:0 2px; }
    .control { display:flex; align-items:center; gap:8px; padding:0 8px; min-width:180px; }
    .control label { font-size:13px; color:var(--muted); white-space:nowrap; }
    .control output { min-width:52px; font-variant-numeric:tabular-nums; font-size:13px; text-align:right; color:#fff; }
    input[type="range"] { width:120px; accent-color:var(--accent); }
    .hint {
      position:absolute; left:16px; bottom:16px; z-index:8;
      max-width:min(520px, calc(100% - 32px));
      background:rgba(9,12,18,.72); border:1px solid rgba(255,255,255,.1); border-radius:14px;
      padding:11px 13px; color:var(--muted); font-size:13px; line-height:1.35;
      backdrop-filter: blur(10px);
      pointer-events:none;
    }
    .hint strong { color:#fff; }
    .stats {
      position:absolute; right:16px; bottom:16px; z-index:8;
      background:rgba(9,12,18,.72); border:1px solid rgba(255,255,255,.1); border-radius:14px;
      padding:10px 13px; color:#c8d0db; font-size:12px; font-variant-numeric:tabular-nums;
      backdrop-filter: blur(10px); text-align:right; pointer-events:none;
    }
    @media (max-width: 900px) {
      .toolbar { left:12px; right:12px; transform:none; justify-content:center; }
      .control { min-width:160px; }
      .hint { bottom:10px; left:10px; }
      .stats { bottom:10px; right:10px; }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="toolbar" aria-label="Physics controls">
    <button id="sphereBtn" class="primary">● Sphere</button>
    <button id="boxBtn">■ Box</button>
    <button id="cylinderBtn">▰ Cylinder</button>
    <button id="clearBtn" class="danger">Clear</button>
    <div class="divider"></div>
    <div class="control">
      <label for="gravity">Gravity</label>
      <input id="gravity" type="range" min="0" max="25" value="9.82" step="0.1" />
      <output id="gravityValue">9.82</output>
    </div>
    <div class="control">
      <label for="restitution">Bounce</label>
      <input id="restitution" type="range" min="0" max="1" value="0.35" step="0.01" />
      <output id="restitutionValue">0.35</output>
    </div>
  </div>

  <div class="hint"><strong>Drag bodies with the mouse.</strong> Left-drag empty space to orbit the camera. Scroll to zoom. Drop shapes from the toolbar to build your own towers.</div>
  <div class="stats" id="stats">Bodies: 0<br>Simulation: 60 Hz</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm';

const app = document.getElementById('app');
const statsEl = document.getElementById('stats');
const gravityInput = document.getElementById('gravity');
const gravityValue = document.getElementById('gravityValue');
const restitutionInput = document.getElementById('restitution');
const restitutionValue = document.getElementById('restitutionValue');

// -------------------- Three.js scene --------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a10);
scene.fog = new THREE.Fog(0x070a10, 18, 70);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(13, 10, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 2.2, 0);
controls.minDistance = 5;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xaad6ff, 0x172033, 1.6));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(8, 17, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -24;
keyLight.shadow.camera.right = 24;
keyLight.shadow.camera.top = 24;
keyLight.shadow.camera.bottom = -24;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 60;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x79a7ff, 0.7);
fillLight.position.set(-12, 7, -9);
scene.add(fillLight);

// -------------------- Ground / environment --------------------
const groundMat = new THREE.MeshStandardMaterial({ color:0x202b35, roughness:0.96, metalness:0.05 });
const ground = new THREE.Mesh(new THREE.BoxGeometry(32, 0.6, 32), groundMat);
ground.position.y = -0.3;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(32, 32, 0x3d5260, 0x263641);
grid.position.y = 0.015;
scene.add(grid);

const rimMat = new THREE.MeshStandardMaterial({ color:0x111820, roughness:0.8, metalness:0.15 });
for (const [x,z,sx,sz] of [
  [0,-16,32,0.7],[0,16,32,0.7],[-16,0,0.7,32],[16,0,0.7,32]
]) {
  const rim = new THREE.Mesh(new THREE.BoxGeometry(sx, 1, sz), rimMat);
  rim.position.set(x,0.25,z); rim.receiveShadow=true; rim.castShadow=true; scene.add(rim);
}

const accentRing = new THREE.Mesh(
  new THREE.RingGeometry(5.7, 5.76, 64),
  new THREE.MeshBasicMaterial({ color:0x5bd5ff, transparent:true, opacity:0.14, side:THREE.DoubleSide })
);
accentRing.rotation.x = -Math.PI / 2;
accentRing.position.y = 0.025;
scene.add(accentRing);

// -------------------- Cannon-es physics --------------------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 18;
world.solver.tolerance = 0.0005;
world.defaultContactMaterial.friction = 0.45;
world.defaultContactMaterial.restitution = 0.35;
world.defaultContactMaterial.contactEquationStiffness = 1e7;
world.defaultContactMaterial.contactEquationRelaxation = 3;

const groundBody = new CANNON.Body({
  type: CANNON.Body.STATIC,
  shape: new CANNON.Box(new CANNON.Vec3(16, 0.3, 16)),
  position: new CANNON.Vec3(0, -0.3, 0)
});
world.addBody(groundBody);

const walls = [
  new CANNON.Body({ type:CANNON.Body.STATIC, shape:new CANNON.Box(new CANNON.Vec3(16,0.5,0.35)), position:new CANNON.Vec3(0,0.25,-16) }),
  new CANNON.Body({ type:CANNON.Body.STATIC, shape:new CANNON.Box(new CANNON.Vec3(16,0.5,0.35)), position:new CANNON.Vec3(0,0.25,16) }),
  new CANNON.Body({ type:CANNON.Body.STATIC, shape:new CANNON.Box(new CANNON.Vec3(0.35,0.5,16)), position:new CANNON.Vec3(-16,0.25,0) }),
  new CANNON.Body({ type:CANNON.Body.STATIC, shape:new CANNON.Box(new CANNON.Vec3(0.35,0.5,16)), position:new CANNON.Vec3(16,0.25,0) })
];
walls.forEach(w => world.addBody(w));

const objects = [];
const colorPalette = [0x48d3ff, 0x8a7dff, 0xff6584, 0xffc45b, 0x59e391, 0xd391ff, 0x6fb8ff];
let paletteIndex = 0;
let nextId = 1;

function makeMaterial(color) {
  return new THREE.MeshStandardMaterial({ color, roughness:0.32, metalness:0.12 });
}

function randomColor() {
  const color = colorPalette[paletteIndex % colorPalette.length];
  paletteIndex++;
  return color;
}

function spawnShape(type) {
  const x = (Math.random() - 0.5) * 8;
  const z = (Math.random() - 0.5) * 8;
  const y = 8 + Math.random() * 1.8;
  const color = randomColor();
  let mesh, body, mass;

  if (type === 'sphere') {
    const r = 0.72 + Math.random() * 0.18;
    mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 18), makeMaterial(color));
    body = new CANNON.Body({ mass: 1.8 + r * 0.8, shape: new CANNON.Sphere(r) });
  } else if (type === 'box') {
    const sx = 0.95 + Math.random() * 0.45;
    const sy = 0.85 + Math.random() * 0.38;
    const sz = 0.95 + Math.random() * 0.45;
    mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), makeMaterial(color));
    body = new CANNON.Body({ mass: 2.2, shape: new CANNON.Box(new CANNON.Vec3(sx/2, sy/2, sz/2)) });
    body.angularDamping = 0.12;
  } else {
    const r = 0.62 + Math.random() * 0.15;
    const h = 1.15 + Math.random() * 0.5;
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 28), makeMaterial(color));
    body = new CANNON.Body({ mass: 2.0, shape: new CANNON.Cylinder(r, r, h, 24) });
    body.angularDamping = 0.14;
  }

  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.set(x, y, z);

  body.position.set(x, y, z);
  body.quaternion.setFromEuler(0, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.16);
  body.linearDamping = 0.015;
  body.angularDamping = Math.max(body.angularDamping, 0.08);
  body.allowSleep = true;
  body.sleepSpeedLimit = 0.08;
  body.sleepTimeLimit = 0.65;
  body.userData = { id: nextId++, type };

  mesh.userData.body = body;
  mesh.userData.playgroundObject = true;

  world.addBody(body);
  scene.add(mesh);
  objects.push({ mesh, body, type });

  // Small initial random spin makes toppling feel natural without becoming chaotic.
  body.velocity.set((Math.random()-0.5)*0.3, 0, (Math.random()-0.5)*0.3);
  body.angularVelocity.set((Math.random()-0.5)*0.7, (Math.random()-0.5)*0.7, (Math.random()-0.5)*0.7);
}

function clearObjects() {
  endDrag({ pointerId: null });
  for (const item of objects) {
    world.removeBody(item.body);
    item.mesh.geometry.dispose();
    item.mesh.material.dispose();
    scene.remove(item.mesh);
  }
  objects.length = 0;
  paletteIndex = 0;
}

function syncObjects() {
  for (const item of objects) {
    item.mesh.position.copy(item.body.position);
    item.mesh.quaternion.copy(item.body.quaternion);
  }
}

// -------------------- Dragging --------------------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -3.0);
const dragPoint = new THREE.Vector3();
let dragBody = null;
let dragConstraint = null;
let dragDistance = 0;

const dragMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.1, 12, 8),
  new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.8 })
);
dragMarker.visible = false;
scene.add(dragMarker);

const dragBodyProxy = new CANNON.Body({ type:CANNON.Body.KINEMATIC, mass:0 });
dragBodyProxy.collisionFilterGroup = 0;
dragBodyProxy.collisionFilterMask = 0;
world.addBody(dragBodyProxy);

function setPointer(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
}

function beginDrag(ev) {
  setPointer(ev);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(objects.map(o => o.mesh), false);
  if (!hits.length) return;
  const hit = hits[0];
  dragBody = hit.object.userData.body;
  if (!dragBody || dragBody.type !== CANNON.Body.DYNAMIC) return;

  controls.enabled = false;
  renderer.domElement.setPointerCapture?.(ev.pointerId);

  const worldPoint = hit.point.clone();
  dragPlane.constant = -worldPoint.y;
  dragDistance = camera.position.distanceTo(worldPoint);
  dragBody.wakeUp();

  const relative = new CANNON.Vec3(
    worldPoint.x - dragBody.position.x,
    worldPoint.y - dragBody.position.y,
    worldPoint.z - dragBody.position.z
  );
  const localPivot = new CANNON.Vec3();
  dragBody.quaternion.inverse().vmult(relative, localPivot);

  dragBodyProxy.position.set(worldPoint.x, worldPoint.y, worldPoint.z);
  dragBodyProxy.velocity.setZero();
  dragConstraint = new CANNON.PointToPointConstraint(
    dragBody,
    localPivot,
    dragBodyProxy,
    new CANNON.Vec3(0,0,0),
    80000
  );
  world.addConstraint(dragConstraint);
  dragMarker.visible = true;
  dragMarker.position.copy(worldPoint);
  ev.preventDefault();
}

function moveDrag(ev) {
  if (!dragBody) return;
  setPointer(ev);
  raycaster.setFromCamera(pointer, camera);

  let found = raycaster.ray.intersectPlane(dragPlane, dragPoint);
  if (!found) {
    dragPoint.copy(raycaster.ray.origin).addScaledVector(raycaster.ray.direction, dragDistance);
  }
  dragPoint.x = THREE.MathUtils.clamp(dragPoint.x, -14.4, 14.4);
  dragPoint.z = THREE.MathUtils.clamp(dragPoint.z, -14.4, 14.4);
  dragPoint.y = THREE.MathUtils.clamp(dragPoint.y, 0.35, 12.0);
  dragBodyProxy.position.set(dragPoint.x, dragPoint.y, dragPoint.z);
  dragMarker.position.copy(dragPoint);
}

function endDrag(ev) {
  if (!dragBody) return;
  if (dragConstraint) world.removeConstraint(dragConstraint);
  dragConstraint = null;
  dragBodyProxy.velocity.setZero();
  dragBody = null;
  dragMarker.visible = false;
  controls.enabled = true;
  try { renderer.domElement.releasePointerCapture?.(ev.pointerId); } catch(e) {}
}

renderer.domElement.addEventListener('pointerdown', beginDrag);
renderer.domElement.addEventListener('pointermove', moveDrag);
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

// -------------------- UI --------------------
document.getElementById('sphereBtn').addEventListener('click', () => spawnShape('sphere'));
document.getElementById('boxBtn').addEventListener('click', () => spawnShape('box'));
document.getElementById('cylinderBtn').addEventListener('click', () => spawnShape('cylinder'));
document.getElementById('clearBtn').addEventListener('click', clearObjects);

gravityInput.addEventListener('input', () => {
  const g = Number(gravityInput.value);
  world.gravity.set(0, -g, 0);
  gravityValue.textContent = g.toFixed(1);
});

restitutionInput.addEventListener('input', () => {
  const r = Number(restitutionInput.value);
  world.defaultContactMaterial.restitution = r;
  restitutionValue.textContent = r.toFixed(2);
});

window.addEventListener('keydown', (e) => {
  if (e.key === '1') spawnShape('sphere');
  if (e.key === '2') spawnShape('box');
  if (e.key === '3') spawnShape('cylinder');
  if (e.key.toLowerCase() === 'c') clearObjects();
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// -------------------- Simulation loop --------------------
const fixedDt = 1/60;
let lastTime = performance.now() / 1000;
let accumulator = 0;
let statTimer = 0;

function animate(nowMs) {
  requestAnimationFrame(animate);
  const now = nowMs / 1000;
  let frameDt = now - lastTime;
  lastTime = now;
  frameDt = Math.min(frameDt, 0.1);
  accumulator += frameDt;

  while (accumulator >= fixedDt) {
    if (dragBody) {
      dragBodyProxy.velocity.setZero();
    }
    world.step(fixedDt);
    accumulator -= fixedDt;
  }

  syncObjects();
  controls.update();
  renderer.render(scene, camera);

  statTimer += frameDt;
  if (statTimer > 0.25) {
    const dynamicCount = objects.filter(o => o.body.type === CANNON.Body.DYNAMIC).length;
    statsEl.innerHTML = `Bodies: ${dynamicCount}<br>Simulation: 60 Hz`;
    statTimer = 0;
  }
}

// Give the playground a small starter stack so it feels alive immediately.
spawnShape('box');
spawnShape('sphere');
spawnShape('cylinder');
spawnShape('box');

requestAnimationFrame(animate);
</script>
</body>
</html>
